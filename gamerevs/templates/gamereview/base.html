{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}GameRevs{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
        }
        .sidebar {
            width: 200px;
            background-color: #2c3e50;
            color: white;
            height: 100vh;
            padding-top: 20px;
            position: fixed;
        }
        .sidebar a {
            display: block;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
        }
        .sidebar a:hover {
            background-color: #34495e;
        }
        .main-content {
            margin-left: 200px;
            width: calc(100% - 200px);
        }
        .banner {
            width: 100%;
            height: 250px;
            background-image: url("{% static 'images/banner.jpg' %}");
            background-size: cover;
            background-position: center;
        }
        .content {
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Side Navigation Bar -->
    <div class="sidebar">
        <h2 style="text-align:center;">Menu</h2>
        <a href="{% url 'home' %}">Home</a>
        <a href="#">Games</a>
        <a href="#">Reviews</a>
        <a href="#">Tags</a>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">

        <!-- Banner Image -->
        <div class="banner"></div>

        <!-- Page Title -->
        <div class="content">
            <h1>{% block page_title %}Welcome to Game Reviews{% endblock %}</h1>

            <!-- Page Content Block -->
            {% block content %}
            <!-- Content goes here -->
            {% endblock %}
        </div>
    </div>

</body>
</html>
